packages:
  - apps/*
  - packages/*

# @types/node tracks the engine, not npm's latest: package.json pins node >=24,
# and 26's types describe APIs this runtime does not have, which is a typecheck
# that passes and a call that throws.
catalog:
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  tailwindcss: 4.3.3
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9
  zod: 4.5.4
  pg-boss: 12.29.0
  '@trpc/server': 11.18.0
  '@trpc/client': 11.18.0
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@tailwindcss/postcss': 4.3.3
  superjson: 2.2.6
  'lucide-react': 1.39.0
  clsx: 2.1.1
  'tailwind-merge': 3.6.0
  jose: 6.2.10

# drizzle-kit bundles esbuild; its install script builds the native binary.
allowBuilds:
  esbuild: true

# exceljs 4.4.0 is the latest release and pulls vulnerable transitives (archiver,
# unzipper, uuid); no patched exceljs exists to upgrade to.
overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'exceljs>uuid': 11.1.1

minimumReleaseAgeExclude:
  - pg-boss@12.29.0
  - '@biomejs/biome@2.5.12'
  - '@biomejs/cli-darwin-arm64@2.5.12'
  - '@biomejs/cli-darwin-x64@2.5.12'
  - '@biomejs/cli-linux-arm64-musl@2.5.12'
  - '@biomejs/cli-linux-arm64@2.5.12'
  - '@biomejs/cli-linux-x64-musl@2.5.12'
  - '@biomejs/cli-linux-x64@2.5.12'
  - '@biomejs/cli-win32-arm64@2.5.12'
  - '@biomejs/cli-win32-x64@2.5.12'
