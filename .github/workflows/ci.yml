name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database and no secrets, so a fork's pull request
  # gets the same answer as a push to main.
  check:
    runs-on: ubuntu-latest
    env:
      # Parseable, never reachable. The pool is constructed at import and does not
      # connect until something queries, which nothing here does.
      DATABASE_URL: postgres://unit:test@127.0.0.1:5432/none
      DATABASE_URL_OWNER: postgres://unit:test@127.0.0.1:5432/none
      AUTH_SECRET: unit-test-secret-at-least-32-chars
      AUTH_URL: http://localhost:3000
      GOOGLE_HOSTED_DOMAIN: example.test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build

  # The suites run against a real Postgres with row level security on, which is the
  # only way they prove anything. It is a throwaway container of the same major
  # version as production, never a hosted database: the suites and the seed empty
  # tables, and scripts/local-only.ts refuses anything that is not on this machine.
  verify:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rawr_app:ci-app-password@localhost:5432/postgres
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_SESSION: postgres://rawr_app:ci-app-password@localhost:5432/postgres
      APP_DB_PASSWORD: ci-app-password
      # Throwaway values for a database that lives as long as this job.
      AUTH_SECRET: ci-auth-secret-at-least-32-characters
      AUTH_URL: http://localhost:3000
      GOOGLE_HOSTED_DOMAIN: example.test
      TOKEN_ENCRYPTION_KEY: WCpOyC3dKpA/lu2McaMPlWlzwRcfYPzPc7TV2zSvS+E=
      RAWR_DEV_CALENDAR: 1
      RAWR_DEV_GMAIL: 1
      RAWR_DEV_INTEGRATIONS: 1
      RAWR_INTERNAL_SECRET: ci-internal-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      # Every suite reads the sandbox and peer tenants and tells you to seed when
      # they are missing.
      - name: Seed
        run: pnpm db:seed

      # verify:mcp calls the real endpoint, so the app has to be up. A small pool
      # on purpose: the suites and the server together otherwise exhaust the
      # connection limit and the failures read as logic errors.
      - name: Start the app
        run: |
          DATABASE_POOL_MAX=5 pnpm dev > /tmp/dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0
            sleep 1
          done
          echo "the app never came up:"; cat /tmp/dev.log; exit 1

      - name: Verify
        run: pnpm verify

      - name: The app's log, when something failed
        if: failure()
        run: cat /tmp/dev.log
